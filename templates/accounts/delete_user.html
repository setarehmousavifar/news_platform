{% extends 'admin_panel/base_admin.html' %}

{% block title %}Delete user — {{ settings.site_name }}{% endblock %}

{% block admin_content %}
<div class="admin-top">
    <div>
        <h1>Delete user</h1>
        <p>This action cannot be undone.</p>
    </div>
</div>
<div class="admin-panel" style="max-width: 520px;">
    <p class="mb-3">Delete <strong>{{ target_user.username }}</strong> ({{ target_user.email }})?</p>
    <form method="post" class="d-flex flex-wrap gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'manage_users' %}" class="btn btn-outline-admin">Cancel</a>
    </form>
</div>
{% endblock %}
