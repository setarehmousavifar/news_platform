{% extends 'base.html' %}

{% block title %}Forbidden — {{ settings.site_name }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <p class="display-4 text-muted mb-2">403</p>
    <h1 class="h3 mb-3">Access denied</h1>
    <p class="text-muted mb-4">You do not have permission to view this page.</p>
    <a href="{% url 'home' %}" class="btn btn-primary me-2">Go Home</a>
    {% if not user.is_authenticated %}
    <a href="{% url 'login' %}" class="btn btn-outline-secondary">Login</a>
    {% endif %}
</div>
{% endblock %}
