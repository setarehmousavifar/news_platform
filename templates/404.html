{% extends 'base.html' %}

{% block title %}Page not found — {{ settings.site_name }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <p class="display-4 text-muted mb-2">404</p>
    <h1 class="h3 mb-3">Page not found</h1>
    <p class="text-muted mb-4">The page you requested does not exist or may have been moved.</p>
    <a href="{% url 'home' %}" class="btn btn-primary me-2">Go Home</a>
    <a href="{% url 'news_list' %}" class="btn btn-outline-secondary">Browse News</a>
</div>
{% endblock %}
