<span class="site-logo{% if logo_class %} {{ logo_class }}{% endif %}{% if logo_variant %} site-logo--{{ logo_variant }}{% endif %}" aria-label="{{ settings.site_name }}">
    <span class="site-logo__main">nevox</span>
    <span class="site-logo__tag">
        <span class="site-logo__tag-text">NEWS!</span>
        <svg class="site-logo__underline" viewBox="0 0 88 10" preserveAspectRatio="none" aria-hidden="true" focusable="false">
            <path d="M2 7 C 22 3, 44 2, 86 6" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </span>
</span>
